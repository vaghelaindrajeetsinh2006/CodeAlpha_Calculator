<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Gallery Header -->
  <header class="gallery-header">
    <div class="header-container">
      <div class="brand-title">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div>
          <h1>Lumina Gallery</h1>
          <p class="subtitle">Explore curated high-definition photography</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Search & Filter Bar -->
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-input" placeholder="Search by title or tag..." aria-label="Search images" />
          <button id="clear-search" class="clear-btn" title="Clear search" hidden>&times;</button>
        </div>

        <div class="stats-badge">
          <span id="total-count">0</span> Photos
        </div>
      </div>
    </div>

    <!-- Category Filter Controls -->
    <nav class="filter-navigation" aria-label="Image Categories">
      <div class="filter-container" id="filter-buttons">
        <button class="filter-btn active" data-category="all">
          <span class="btn-icon">✨</span> All
        </button>
        <button class="filter-btn" data-category="nature">
          <span class="btn-icon">🌲</span> Nature
        </button>
        <button class="filter-btn" data-category="city">
          <span class="btn-icon">🌆</span> City
        </button>
        <button class="filter-btn" data-category="animals">
          <span class="btn-icon">🦁</span> Animals
        </button>
        <button class="filter-btn" data-category="architecture">
          <span class="btn-icon">🏛️</span> Architecture
        </button>
        <button class="filter-btn" data-category="food">
          <span class="btn-icon">🍕</span> Food
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="gallery-info-bar">
      <div id="filter-status">Showing <strong>All</strong> photos</div>
      <div class="grid-controls">
        <button id="grid-prev-btn" class="nav-control-btn" title="Previous Page" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          <span>Prev</span>
        </button>
        <span id="page-indicator">Page 1 of 1</span>
        <button id="grid-next-btn" class="nav-control-btn" title="Next Page">
          <span>Next</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery-grid">
      <!-- Gallery Cards will be injected dynamically via script.js -->
    </div>

    <!-- Empty State Message -->
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">🔍</div>
      <h3>No images found</h3>
      <p>Try adjusting your search terms or select a different category filter.</p>
      <button id="reset-filter-btn" class="action-btn">Reset Filters</button>
    </div>
  </main>

  <!-- Lightbox Modal Container -->
  <div id="lightbox-modal" class="lightbox-modal hidden" role="dialog" aria-modal="true" aria-label="Image Lightbox">
    <div class="lightbox-overlay" id="lightbox-overlay"></div>
    
    <div class="lightbox-content">
      <!-- Lightbox Header -->
      <div class="lightbox-header">
        <div class="lightbox-title-area">
          <span id="lightbox-category" class="category-badge">Nature</span>
          <h2 id="lightbox-title">Image Title</h2>
        </div>

        <div class="lightbox-header-actions">
          <span id="lightbox-counter" class="counter-badge">1 / 12</span>
          <button id="lightbox-close" class="close-btn" aria-label="Close Lightbox" title="Close (Esc)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Lightbox Image Stage with Previous & Next Navigation Buttons -->
      <div class="lightbox-stage">
        <button id="lightbox-prev" class="lightbox-nav-btn prev-btn" aria-label="Previous Image" title="Previous Image (Left Arrow)">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="lightbox-image-wrapper" id="image-wrapper">
          <div class="spinner" id="lightbox-spinner"></div>
          <img id="lightbox-img" src="" alt="Enlarged view" />
        </div>

        <button id="lightbox-next" class="lightbox-nav-btn next-btn" aria-label="Next Image" title="Next Image (Right Arrow)">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <!-- Lightbox Footer Controls -->
      <div class="lightbox-footer">
        <p id="lightbox-desc" class="image-desc">Detailed photo caption will appear here.</p>
        
        <div class="lightbox-toolbar">
          <div class="zoom-controls">
            <button id="zoom-out-btn" class="tool-btn" title="Zoom Out (-)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <span id="zoom-level">100%</span>
            <button id="zoom-in-btn" class="tool-btn" title="Zoom In (+)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button id="zoom-reset-btn" class="tool-btn text-btn" title="Reset Zoom">Reset</button>
          </div>

          <div class="meta-tags" id="lightbox-tags">
            <!-- Tags rendered dynamically -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
